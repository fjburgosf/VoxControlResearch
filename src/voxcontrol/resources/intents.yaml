# Optional politeness / discourse wrappers used to diversify surface forms.
wrappers:
  es:
    prefix: ["", "", "por favor ", "oye ", "ahora ", "a ver "]
    suffix: ["", "", " por favor", " ya", " ahora mismo", " gracias"]
  en:
    prefix: ["", "", "please ", "hey ", "now "]
    suffix: ["", "", " please", " now", " right away", " thanks"]
