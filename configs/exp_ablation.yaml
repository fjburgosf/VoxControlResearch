experiment:
  name: ablation
  type: ablation
  seeds: [100, 101, 102, 103, 104, 105, 106, 107, 108, 109]
dataset:
  languages: [es, en]
  variants_train: 8
  variants_cal: 5
  variants_test: 5
costs:
  error: {low: 2.0, medium: 5.0, high: 20.0}
  confirm: 0.3
  reject: 1.0
baselines:
  tau_fixed: 0.7
ucil:
  predictor: tfidf_logreg
  ood_detector: fused
  calibrator: auto
  memory_threshold: 0.70
combined_noise_rate: 0.15
noise_rates: [0.0, 0.05, 0.1, 0.2, 0.3]
